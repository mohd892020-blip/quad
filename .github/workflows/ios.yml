# Builds the iPhone app on a GitHub macOS runner, since this project has no Mac. For now it builds for the simulator
# only: it starts the game on an iPhone and an iPad, upright and sideways, and keeps the screenshots and the page's
# log as the run's artifact. The simulator build carries no Firebase key, so nothing secret is saved.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['ios/**', 'scripts/ios-page.js', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the game page
        run: |
          npm ci
          npm run build
          node scripts/ios-page.js

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild -quiet -project ios/FlyingParcel.xcodeproj -scheme FlyingParcel -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$(node -p "require('./package.json').version")" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build

      - name: Play it on an iPhone and an iPad
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/FlyingParcel.app
          ID=com.flyingparcel.game
          mkdir -p shots
          # the newest iOS runtime's last device whose name matches
          pick() {
            xcrun simctl list devices available -j | jq -r --arg re "$1" \
              '[.devices | to_entries | sort_by(.key)[] | select(.key | test("iOS")) | .value[] | select(.name | test($re))] | last | .udid // empty'
          }
          play() {
            local udid="$1" name="$2"
            [ -n "$udid" ] || { echo "no $name simulator"; return 0; }
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" "$ID"
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/$name-upright.png"
            xcrun simctl terminate "$udid" "$ID" || true
            sleep 3
            xcrun simctl launch "$udid" "$ID" -ForceSideways YES
            sleep 25
            xcrun simctl io "$udid" screenshot "shots/$name-sideways.png"
            xcrun simctl spawn "$udid" log show --last 10m --style compact \
              --predicate 'subsystem == "com.flyingparcel.game" OR (process == "FlyingParcel" AND messageType == error)' \
              > "shots/$name-log.txt" || true
            echo "----- $name log"
            cat "shots/$name-log.txt"
            xcrun simctl shutdown "$udid" || true
          }
          xcrun simctl list devices available | head -n 60
          play "$(pick '^iPhone.*Pro Max$')" iphone
          play "$(pick '^iPad Pro 13')" ipad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: shots/
          retention-days: 14
