# Builds the iPhone app on a GitHub macOS runner, since this project has no Mac. For now it builds for the simulator
# only: it starts the game on an iPhone and an iPad, upright and sideways, and keeps the screenshots and the page's
# log as the run's artifact and on the ios-preview branch. The simulator build carries no Firebase key, so nothing secret
# is saved.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['ios/**', 'scripts/ios-page.js', '.github/workflows/ios.yml', '.github/ios-play.sh']

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the game page
        run: |
          npm ci
          npm run build
          node scripts/ios-page.js

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild -quiet -project ios/FlyingParcel.xcodeproj -scheme FlyingParcel -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$(node -p "require('./package.json').version")" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build

      # Each device in a step of its own, every simulator call with a time limit, and what happened as notes on the run's
      # public summary page, so a hang on one device still leaves the other's screenshots.
      - name: Play it on an iPhone
        timeout-minutes: 15
        run: bash .github/ios-play.sh '^iPhone.*Pro Max$' iphone

      - name: Play it on an iPad
        if: always()
        timeout-minutes: 15
        run: bash .github/ios-play.sh '^iPad Pro 13' ipad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: shots/
          retention-days: 14

      # The latest run's screenshots and log also go to the ios-preview branch, which anyone can open without signing in.
      - name: Put the screenshots on the ios-preview branch
        if: always() && github.ref == 'refs/heads/master'
        run: |
          mkdir -p shots/small
          for f in shots/*.png; do [ -e "$f" ] && sips -Z 900 -s format jpeg "$f" --out "shots/small/$(basename "${f%.png}").jpg" >/dev/null; done
          cd shots
          git init -q -b ios-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS simulator run ${{ github.run_number }} for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-preview
