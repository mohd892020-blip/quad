    <ellipse cx="168" cy="112" rx="7.2" ry="2.5600000000000005" fill="#6d6488"/>
    <circle cx="168" cy="110.4" r="2.8800000000000003" fill="#c9c2d8"/>
  </g>
  <g>
    <ellipse cx="344" cy="110.4" rx="54" ry="9.180000000000001" fill="url(#disc)" stroke="#fff3df" stroke-opacity=".35" stroke-width="1.5"/>
    <g transform="rotate(-18 344 110.4)">
      <path d="M344 110.4 C322.4 106.4 298.1 108 292.7 110.4 C298.1 112 322.4 112.80000000000001 344 110.4 Z" fill="#14101f" opacity=".9"/>
      <path d="M344 110.4 C365.6 114.4 389.9 112.80000000000001 395.3 110.4 C389.9 108.80000000000001 365.6 108 344 110.4 Z" fill="#14101f" opacity=".9"/>
    </g>
    <rect x="336.8" y="112" width="14.4" height="12" rx="2.4000000000000004" fill="url(#motor)"/>
    <ellipse cx="344" cy="112" rx="7.2" ry="2.5600000000000005" fill="#6d6488"/>
    <circle cx="344" cy="110.4" r="2.8800000000000003" fill="#c9c2d8"/>
  </g>
  <!-- landing gear -->
  <path d="M224 190 L208 232 M288 190 L304 232" stroke="#1d1730" stroke-width="8" stroke-linecap="round"/>
  <path d="M186 234 H234 M278 234 H326" stroke="#1d1730" stroke-width="8" stroke-linecap="round"/>
  <!-- body: dark chassis under a red shell -->
  <path d="M184 176 C184 196 222 204 256 204 C290 204 328 196 328 176 Z" fill="#231c36"/>
  <path d="M184 176 C184 142 218 126 256 126 C294 126 328 142 328 176 C328 186 294 192 256 192 C218 192 184 186 184 176 Z" fill="url(#shell)"/>
  <path d="M206 150 C218 136 238 132 256 132 C276 132 292 136 304 146 C288 142 272 140 256 140 C236 140 220 143 206 150 Z" fill="#fff" opacity=".4"/>
  <path d="M188 176 C200 186 228 190 256 190 C284 190 312 186 324 176" fill="none" stroke="#7a1d10" stroke-width="2" opacity=".6"/>
  <!-- front sensors and the camera under the nose -->
  <rect x="232" y="168" width="48" height="12" rx="6" fill="#14101f"/>
  <rect x="236" y="171" width="40" height="2" rx="1" fill="#fff" opacity=".18"/><circle cx="242" cy="175" r="2.2" fill="#55607a"/><circle cx="270" cy="175" r="2.2" fill="#55607a"/>
  <rect x="246" y="196" width="20" height="9" rx="3" fill="#1d1730"/>
  <circle cx="256" cy="213" r="11" fill="#2a2240"/><circle cx="256" cy="213" r="7" fill="url(#lens)"/><circle cx="253.5" cy="210.5" r="2" fill="#fff" opacity=".8"/>
  <!-- the rope's winch -->
  <rect x="226" y="194" width="14" height="10" rx="3" fill="#3a3150"/>
  <path d="M198 178 L112 172" stroke="url(#arm)" stroke-width="14" stroke-linecap="round"/>
  <path d="M198 174.08 L112 168.08" stroke="#7a7094" stroke-opacity=".55" stroke-width="3.08" stroke-linecap="round"/>
  <path d="M314 178 L400 172" stroke="url(#arm)" stroke-width="14" stroke-linecap="round"/>
  <path d="M314 174.08 L400 168.08" stroke="#7a7094" stroke-opacity=".55" stroke-width="3.08" stroke-linecap="round"/>

  <g>
    <ellipse cx="112" cy="157.9" rx="74" ry="12.58" fill="url(#disc)" stroke="#fff3df" stroke-opacity=".35" stroke-width="1.5"/>
    <g transform="rotate(-12 112 157.9)">
      <path d="M112 157.9 C82.4 152.65 49.1 154.75 41.7 157.9 C49.1 160 82.4 161.05 112 157.9 Z" fill="#14101f" opacity=".9"/>
      <path d="M112 157.9 C141.6 163.15 174.9 161.05 182.3 157.9 C174.9 155.8 141.6 154.75 112 157.9 Z" fill="#14101f" opacity=".9"/>
    </g>
    <rect x="102.55" y="160" width="18.900000000000002" height="15.75" rx="3.1500000000000004" fill="url(#motor)"/>
    <ellipse cx="112" cy="160" rx="9.450000000000001" ry="3.3600000000000003" fill="#6d6488"/>
    <circle cx="112" cy="157.9" r="3.7800000000000002" fill="#c9c2d8"/>
  </g>
  <g>
    <ellipse cx="400" cy="157.9" rx="74" ry="12.58" fill="url(#disc)" stroke="#fff3df" stroke-opacity=".35" stroke-width="1.5"/>
    <g transform="rotate(20 400 157.9)">
      <path d="M400 157.9 C370.4 152.65 337.1 154.75 329.7 157.9 C337.1 160 370.4 161.05 400 157.9 Z" fill="#14101f" opacity=".9"/>
      <path d="M400 157.9 C429.6 163.15 462.9 161.05 470.3 157.9 C462.9 155.8 429.6 154.75 400 157.9 Z" fill="#14101f" opacity=".9"/>
