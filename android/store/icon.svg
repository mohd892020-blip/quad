    <ellipse cx="400" cy="160" rx="9.450000000000001" ry="3.3600000000000003" fill="#6d6488"/>
    <circle cx="400" cy="157.9" r="3.7800000000000002" fill="#c9c2d8"/>
  </g>
  <!-- navigation lights at the front motors -->
  <circle cx="112" cy="182" r="14" fill="#4fc27c" opacity=".3"/><circle cx="112" cy="182" r="6" fill="#7dffaa"/>
  <circle cx="400" cy="182" r="14" fill="#ff5a4a" opacity=".3"/><circle cx="400" cy="182" r="6" fill="#ff8a7a"/>
  </g>
</svg>
