<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a4d"/>
      <stop offset=".5" stop-color="#3b2452"/>
      <stop offset="1" stop-color="#6e3358"/>
    </linearGradient>
    <radialGradient id="b1" cx=".12" cy=".2" r=".55"><stop offset="0" stop-color="#ff7054" stop-opacity=".55"/><stop offset="1" stop-color="#ff7054" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx=".95" cy=".6" r=".55"><stop offset="0" stop-color="#54aaff" stop-opacity=".45"/><stop offset="1" stop-color="#54aaff" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3" cx=".3" cy="1" r=".6"><stop offset="0" stop-color="#ffc45a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc45a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffc23d" stop-opacity=".45"/><stop offset="1" stop-color="#ffc23d" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7550"/><stop offset="1" stop-color="#d33a20"/></linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a660"/><stop offset="1" stop-color="#c47a36"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset=".55" stop-color="#e8492c"/><stop offset="1" stop-color="#b52e1a"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4160"/><stop offset="1" stop-color="#1d1730"/></linearGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1430"/><stop offset=".45" stop-color="#5b5272"/><stop offset="1" stop-color="#1a1430"/></linearGradient>
    <radialGradient id="disc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3df" stop-opacity=".05"/><stop offset=".8" stop-color="#fff3df" stop-opacity=".28"/><stop offset="1" stop-color="#fff3df" stop-opacity=".05"/></radialGradient>
    <radialGradient id="lens" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#7fd4ff"/><stop offset=".5" stop-color="#1b3d66"/><stop offset="1" stop-color="#0b0a18"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#b1)"/>
  <rect width="512" height="512" fill="url(#b2)"/>
  <rect width="512" height="512" fill="url(#b3)"/>
  <circle cx="256" cy="330" r="170" fill="url(#glow)"/>

  <g transform="translate(256 262) scale(.87) translate(-256 -262)">
  <!-- swinging rope + parcel -->
  <g transform="rotate(-7 233 204)">
    <line x1="233" y1="204" x2="233" y2="300" stroke="#fff3df" stroke-width="6" stroke-linecap="round"/>
    <circle cx="233" cy="300" r="8" fill="none" stroke="#fff3df" stroke-width="5"/>
    <rect x="159" y="306" width="148" height="108" rx="12" fill="url(#kraft)"/>
    <rect x="159" y="306" width="148" height="24" rx="12" fill="#f0bd7a"/>
    <rect x="159" y="318" width="148" height="12" fill="#f0bd7a"/>
    <rect x="159" y="330" width="148" height="5" fill="#a9632a" opacity=".5"/>
    <rect x="220" y="306" width="26" height="108" fill="#fbe2b4"/>
    <rect x="175" y="372" width="30" height="26" rx="5" fill="#e8492c"/>
    <path d="M190 377 l-8 9 h5 v8 h6 v-8 h5 z" fill="#fff3df"/>
