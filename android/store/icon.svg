  <path d="M232 146.92 L168 114.92" stroke="#7a7094" stroke-opacity=".55" stroke-width="2.42" stroke-linecap="round"/>
  <path d="M280 150 L344 118" stroke="url(#arm)" stroke-width="11" stroke-linecap="round"/>
  <path d="M280 146.92 L344 114.92" stroke="#7a7094" stroke-opacity=".55" stroke-width="2.42" stroke-linecap="round"/>

