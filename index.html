<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flying Pizza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700;800&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill" id="money">$0<small id="del">0 deliveries</small></div>
    <button class="pill icon" id="gear" aria-label="Settings">⚙</button>
    <button class="pill icon" id="mute" aria-label="Mute">♪</button>
    <div class="pill" id="order"><b id="oTitle">—</b><span id="oSub"></span></div>
    <div class="pill" id="meters">
      <span>TIME</span><span id="clock">--:--</span>
      <span>BATTERY</span><div class="bar" id="bBat"><i></i></div>
      <span>HEAT</span><div class="bar" id="bHeat"><i></i></div>
      <span>ORDER</span><div class="bar" id="bBox"><i></i></div>
      <span>BOOST</span><div class="bar" id="bBoost"><i></i></div>
      <span>ROPE</span><div class="bar" id="bRope"><i></i></div>
    </div>
    <canvas id="map" aria-label="City map"></canvas>
    <div id="wind" aria-label="Wind"><span>WIND</span><div id="windTrack"><i id="windNeedle"></i></div></div>
  </div>
  <div id="toast" hidden role="status"><b id="toastTitle"></b><span id="toastWhy"></span></div>
  <div id="controls" hidden>
    <div class="grp" id="arrows" hidden><button class="btn" id="lt" aria-label="Left">◀</button><button class="btn" id="rt" aria-label="Right">▶</button></div>
    <div id="joy" hidden aria-label="Steer left or right"><i id="knob"></i></div>
    <div class="grp"><button class="btn" id="boost" aria-label="Boost, Shift or B">BOOST<small>Shift</small></button><button class="btn" id="up" aria-label="Lift">LIFT</button></div>
  </div>
  <div id="actions">
    <button class="act" id="ropeUp" hidden>Rope ▲</button>
    <button class="act" id="ropeDown" hidden>Rope ▼</button>
    <button class="act" id="hold" hidden>Hold</button>
  </div>
  <div id="dev" hidden>
    <button class="act" id="devAuto">Auto deliver</button>
    <button class="act" id="devCharge">Charge</button>
  </div>
  <div id="keys" hidden>← → tilt · ↑ or Space lift · Shift boost · ↓ lower rope · Q raise · H hold · M mute</div>
  <div id="overlay">
    <div class="card" id="cardStart">
      <h1>Flying Pizza</h1>
      <button class="go" id="start">Play</button>
    </div>
  </div>
  <div id="sheet" hidden>
    <div class="card" role="dialog" aria-label="Settings">
      <h2>Settings</h2>
      <section>
        <h3>Touch controls</h3>
        <div class="seg"><button id="ctlJoy">Joystick</button><button id="ctlArrows">Arrows</button></div>
      </section>
      <section>
        <h3>Aircraft</h3>
        <canvas id="preview" width="480" height="200"></canvas>
        <div class="chips" id="planes"></div>
      </section>
      <section>
        <h3>Developer</h3>
        <form id="devForm">
          <input id="devCode" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" aria-label="Developer password">
          <button type="submit">Unlock</button>
        </form>
        <p id="devMsg"></p>
      </section>
      <button class="go" id="sheetClose">Close</button>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
