<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flying Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="pill" id="money">$0<small id="del">0 deliveries</small></div>
    <div class="pill" id="order"><b id="oTitle">—</b><span id="oSub"></span></div>
    <div class="pill" id="meters">
      <span>TIME</span><span id="clock">3:00</span>
      <span>BATTERY</span><div class="bar" id="bBat"><i></i></div>
      <span>HEAT</span><div class="bar" id="bHeat"><i></i></div>
      <span>ORDER</span><div class="bar" id="bBox"><i></i></div>
    </div>
  </div>
  <div id="controls" hidden>
    <div class="grp"><button class="btn" id="lt" aria-label="Left">◀</button><button class="btn" id="rt" aria-label="Right">▶</button></div>
    <div class="grp"><button class="btn" id="up" aria-label="Lift">LIFT</button></div>
  </div>
  <div id="keys" hidden>← → tilt · ↑ or Space lift</div>
  <div id="overlay">
    <div class="card" id="cardStart">
      <h1>Flying Pizza</h1>
      <p class="tag">Fly it there. Keep it in one piece.</p>
      <button class="go" id="start">Play</button>
    </div>
    <div class="card" id="cardEnd" hidden>
      <h1 id="endTitle">Shift over</h1>
      <div class="big" id="endMoney">$0</div>
      <div class="stats"><span id="endDel"></span><span id="endBest"></span></div>
      <button class="go" id="again">Play again</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
